name: 🏆 Generate Trophy SVG

on:
  schedule:
    - cron: "0 1 * * 1"
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  generate-trophy:
    name: Fetch & Save Trophy SVG
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout main
        uses: actions/checkout@v4

      - name: 🏆 Download trophy SVG (com fallback)
        run: |
          STATUS=$(curl -s -o trophies.svg -w "%{http_code}" \
            -H "User-Agent: Mozilla/5.0 (GitHub Actions)" \
            "https://github-profile-trophy.vercel.app/?username=jvictorbap&theme=tokyonight&no-frame=true&no-bg=true&margin-w=8&margin-h=8&column=4")

          # Verifica se retornou SVG válido
          if [ "$STATUS" = "200" ] && grep -q "<svg" trophies.svg; then
            echo "✅ Trophy SVG obtido da API (HTTP $STATUS)"
          else
            echo "⚠️  API retornou $STATUS — gerando SVG fallback"
            cp .github/trophies-fallback.svg trophies.svg
          fi

      - name: 🚀 Push trophies.svg para branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: .
          keep_history: true
          jekyll: false
          commit_message: "chore: update trophies SVG [skip ci]"
          include: |
            trophies.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
