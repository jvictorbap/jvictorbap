name: 🏆 Generate Trophy SVG

on:
  schedule:
    - cron: "0 1 * * 1"
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  generate-trophy:
    name: Fetch & Save Trophy SVG
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout main
        uses: actions/checkout@v4

      - name: 🏆 Download trophy SVG (com fallback)
        run: |
          STATUS=$(curl -s -o trophies.svg -w "%{http_code}" \
            -H "User-Agent: Mozilla/5.0 (GitHub Actions)" \
            "https://github-profile-trophy.vercel.app/?username=jvictorbap&theme=tokyonight&no-frame=true&no-bg=true&margin-w=8&margin-h=8&column=4")

          if [ "$STATUS" = "200" ] && grep -q "<svg" trophies.svg; then
            echo "✅ Trophy SVG obtido da API (HTTP $STATUS)"
          else
            echo "⚠️  API retornou $STATUS — usando SVG fallback"
            cp .github/trophies-fallback.svg trophies.svg
          fi

          echo "--- Conteúdo gerado (primeiros 100 chars) ---"
          head -c 100 trophies.svg

      - name: 📥 Checkout branch output (preserva snake SVGs)
        uses: actions/checkout@v4
        with:
          ref: output
          path: output-branch

      - name: 📋 Copiar trophies.svg para branch output
        run: |
          cp trophies.svg output-branch/trophies.svg
          echo "✅ trophies.svg copiado"
          ls -la output-branch/

      - name: 💾 Commit & push apenas trophies.svg
        run: |
          cd output-branch
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add trophies.svg
          git diff --cached --quiet \
            && echo "Sem mudanças no SVG." \
            || git commit -m "chore: update trophies SVG [skip ci]"
          git push origin output
