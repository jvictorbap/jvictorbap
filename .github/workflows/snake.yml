name: 🐍 Generate Snake Animation

on:
  # Roda automaticamente todo dia às 00:00 UTC
  schedule:
    - cron: "0 0 * * *"
  # Permite rodar manualmente pelo GitHub (Actions > Run workflow)
  workflow_dispatch:
  # Roda também quando fizer push para a branch main/master
  push:
    branches:
      - main
      - master

jobs:
  generate:
    name: Generate Snake SVG
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Generate Snake (dark + light)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: 🚀 Push output to branch `output`
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
